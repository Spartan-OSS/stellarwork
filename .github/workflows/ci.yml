name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s model -v
      - run: python3 model/demo.py
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32v1-none
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --target wasm32v1-none --release --locked -p stellarwork-escrow
